<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processing — Sentri</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body class="loading">

    <!-- background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- nav -->
    <nav>
        <a class="nav-brand" href="/">
            <div class="nav-shield">🛡</div>
            <span class="nav-logo-text">Sentri</span>
        </a>
        <div class="nav-status">
            <div class="status-dot"></div>
            PROCESSING
        </div>
    </nav>

    <!-- main -->
    <main>
        <div class="loading-container">
            <div class="loading-card">

                <h2>Processing Traffic Data...</h2>

                <div class="loading-status">
                    <div class="check-circle">✓</div>
                    <p>File Upload Complete</p>
                    <span id="file-display-name">loading...</span>
                </div>

                <div class="steps">
                    <div class="step done">
                        ✔ Step 1/3: Pre-analysis check (Done)
                    </div>

                    <div class="step done">
                        ✔ Step 2/3: Feature extraction (Done)
                    </div>

                    <div class="step active" id="step-3">
                        <span class="loader"></span>
                        Step 3/3: Running AI detection...
                    </div>
                </div>

                <p class="eta">
                    Estimated Time Remaining: <span id="eta">8 - 15 seconds</span>
                </p>

            </div>
        </div>
    </main>

    <script>
const storedFileName = sessionStorage.getItem('file_name');

document.getElementById('file-display-name').textContent =
    storedFileName ? storedFileName : "pasted_data.csv";

const stepEls = document.querySelectorAll(".step");

const steps = [
    "Step 1/3: Pre-analysis check",
    "Step 2/3: Feature extraction",
    "Step 3/3: Running AI detection"
];

let current = 0;

// render all states
function render() {
    stepEls.forEach((el, i) => {

        if (i < current) {
            el.className = "step done";
            el.innerHTML = `✔ ${steps[i]}`;

        } else if (i === current) {
            el.className = "step active";
            el.innerHTML = `⏳ ${steps[i]}`;

        } else {
            el.className = "step";
            el.innerHTML = `⚪ ${steps[i]}`;
        }
    });
}

// run one step fully (loading → done)
function runStep() {

    if (current >= steps.length) {
        document.getElementById("eta").textContent = "Complete!";

        setTimeout(() => {
            window.location.href = "/results";
        }, 1000);

        return;
    }

    // STEP START → LOADING
    render();

    setTimeout(() => {

        // STEP COMPLETE → DONE
        current++;
        render();

        // NEXT STEP ONLY AFTER THIS IS DONE
        setTimeout(runStep, 400);

    }, 1500);
}

runStep();
</script>

</body>

</html>
